name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: spine_test_ci
          POSTGRES_USER: spine_test_ci
          POSTGRES_PASSWORD: spine_test_ci_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U spine_test_ci -d spine_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SPINE_TEST_DATABASE_URL: postgresql+psycopg://spine_test_ci:spine_test_ci_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/spine_test_ci
      SPINE_TEST_DATABASE_EXPECTED_NAME: spine_test_ci
      SPINE_TEST_DATABASE_DISPOSABLE_MARKER: spine-test-harness:v1:ci
      SPINE_TEST_DATABASE_USE_TESTCONTAINERS: "false"

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Mark the isolated service database as disposable
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U spine_test_ci -d spine_test_ci
          -c "COMMENT ON DATABASE spine_test_ci IS 'spine-test-harness:v1:ci'"
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests
      - run: git diff --check
