name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests
      - run: git diff --check

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --extra dev --locked
      - run: pnpm web:api:check
      - run: pnpm web:typecheck
      - run: pnpm web:build
      - run: pnpm web:test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm web:test:e2e
      - run: git diff --check

  r1-regression-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - name: Run mandatory repository and PostgreSQL suite
        id: repository-tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          uv run pytest -q > r1-gate-pytest.log 2>&1
          pytest_status=$?
          cat r1-gate-pytest.log
          gate_status=$(PYTEST_STATUS="$pytest_status" uv run python -c 'import os; from pathlib import Path; from tests.qualification.gate_runner import classify_result; result = classify_result(("uv", "run", "pytest", "-q"), returncode=int(os.environ["PYTEST_STATUS"]), output=Path("r1-gate-pytest.log").read_text()); print(result.status)')
          if [ "$gate_status" = "passed" ]; then
            echo "gate_flag=--repository-tests-passed" >> "$GITHUB_OUTPUT"
          elif [ "$gate_status" = "blocked-infrastructure" ]; then
            echo "gate_flag=--repository-tests-unavailable" >> "$GITHUB_OUTPUT"
          else
            echo "gate_flag=--repository-tests-failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Run deterministic offline R1 regression gate
        if: always()
        run: uv run spine-eval-gate "${{ steps.repository-tests.outputs.gate_flag }}" --output r1-gate-status.json
      - name: Upload versioned R1 gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-gate-status
          path: r1-gate-status.json
