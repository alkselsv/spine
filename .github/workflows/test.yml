name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests
      - run: git diff --check

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck
      - run: pnpm web:build
      - run: pnpm web:test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm web:test:e2e
      - run: git diff --check

  offline-regression-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - name: Run deterministic offline regression gate
        run: uv run spine-eval-gate --output offline-regression-gate.json
      - name: Upload offline regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-regression-gate
          path: offline-regression-gate.json
