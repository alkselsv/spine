name: test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --locked
      - run: uv run python -m compileall -q src tests
      - name: Run version-sensitive compatibility suite
        run: >-
          uv run pytest -q
          tests/application/persistence/test_command_digest.py
          tests/application/persistence/test_source_observation.py
          tests/infrastructure/auth/test_dependency_contract.py
          tests/infrastructure/db/test_dependency_contract.py
          tests/infrastructure/memory/test_cognee_dependency_contract.py
          tests/qualification/test_issue592_qualification.py
          tests/test_architecture_scaffold.py
      - run: git diff --check

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --extra dev --locked
      - run: pnpm web:api:check
      - run: pnpm web:typecheck
      - run: pnpm web:build
      - run: pnpm web:test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm web:test:e2e
      - run: git diff --check

  r1-regression-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install media probe for frozen synthetic fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffprobe -version
      - run: uv sync --extra dev --locked
      - run: uv run python -m compileall -q src tests
      - name: Qualify clean PostgreSQL migration target
        env:
          SPINE_R1_TARGET_ROLE: clean
          SPINE_R1_TARGET_RECEIPT: ${{ runner.temp }}/r1-clean-target.json
        run: >-
          uv run pytest -q
          tests/integration/postgresql/test_r1_migration_targets.py::test_current_graph_applies_to_clean_target
      - name: Qualify retained-revision PostgreSQL migration target
        env:
          SPINE_R1_TARGET_ROLE: upgrade
          SPINE_R1_TARGET_RECEIPT: ${{ runner.temp }}/r1-upgrade-target.json
        run: >-
          uv run pytest -q
          tests/integration/postgresql/test_initial_tenancy_migration.py::test_every_retained_revision_upgrades_to_one_final_head
      - name: Run mandatory repository and PostgreSQL suite
        id: repository-tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest_log="$RUNNER_TEMP/r1-gate-pytest.log"
          uv run pytest -q --junitxml="$RUNNER_TEMP/r1-repository-tests.xml" > "$pytest_log" 2>&1
          pytest_status=$?
          cat "$pytest_log"
          gate_status=$(PYTEST_STATUS="$pytest_status" PYTEST_LOG="$pytest_log" uv run python -c 'import os; from pathlib import Path; from tests.qualification.gate_runner import classify_result; result = classify_result(("uv", "run", "pytest", "-q"), returncode=int(os.environ["PYTEST_STATUS"]), output=Path(os.environ["PYTEST_LOG"]).read_text()); print(result.status)')
          if [ "$gate_status" = "passed" ]; then
            echo "gate_flag=--repository-tests-passed" >> "$GITHUB_OUTPUT"
          elif [ "$gate_status" = "blocked-infrastructure" ]; then
            echo "gate_flag=--repository-tests-unavailable" >> "$GITHUB_OUTPUT"
          else
            echo "gate_flag=--repository-tests-failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect canonical R1 repository evidence
        if: always() && steps.repository-tests.outcome == 'success'
        run: >-
          uv run spine-r1-repository-evidence
          --head-sha "$GITHUB_SHA"
          --clean-target "$RUNNER_TEMP/r1-clean-target.json"
          --upgrade-target "$RUNNER_TEMP/r1-upgrade-target.json"
          --junit "$RUNNER_TEMP/r1-repository-tests.xml"
          --skip-policy docs/qualification/r1-repository-skip-policy-v1.json
          --output r1-repository-evidence.json
      - name: Attest R1 repository evidence from main
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.repository-tests.outcome == 'success'
        uses: actions/attest@v4
        with:
          subject-path: r1-repository-evidence.json
      - name: Upload metadata-only R1 repository evidence
        if: always() && steps.repository-tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r1-repository-evidence
          path: r1-repository-evidence.json
      - name: Run deterministic offline R1 regression gate
        if: always()
        run: >-
          uv run spine-eval-gate "${{ steps.repository-tests.outputs.gate_flag }}"
          --ci-run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA"
          --output r1-gate-status.json
      - name: Upload versioned R1 gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-gate-status
          path: r1-gate-status.json
