[project]
name = "spine"
version = "0.1.0"
description = "Spine — context-aware orchestration platform for AI agents and humans."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "alembic>=1.17.1,<2",
    "cognee==1.5.4",
    "fastapi>=0.115.0",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2.12,<4",
    "PyJWT[crypto]>=2.14,<3",
    "sqlalchemy>=2.0.44,<2.1",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.13.2,<5",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
spine-seed = "spine.scripts.seed:main"
spine-ask = "spine.scripts.ask_cli:main"
spine-db-bootstrap = "spine.scripts.database:operator_bootstrap_main"
spine-db-migrate = "spine.scripts.database:migrate_main"
spine-db-bootstrap-workspace = "spine.scripts.database:initial_workspace_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "spine/infrastructure/db/alembic.ini"
"migrations" = "spine/infrastructure/db/alembic_migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "postgresql: mandatory tests against the pinned real PostgreSQL major",
]
