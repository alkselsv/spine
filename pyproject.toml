[project]
name = "spine"
version = "0.1.0"
description = "Spine — context-aware orchestration platform for AI agents and humans."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "cognee>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
spine-seed = "spine.scripts.seed:main"
spine-ask = "spine.scripts.ask_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
